<html>

<head>

<!-- style.css -->

<!-- Quicksand Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

<!-- website .ico -->
<link rel="icon" href="/favicon.ico" type="image/x-icon">
 
</head>

<body>



<script>
function openGame(url) {
    var win = window.open('about:blank', '_blank');

    win.document.write(`
        <html>
        <head>
            <title>about:blank</title>
            <style>
                body {
                    margin: 0;
                    overflow: hidden;
                }
                iframe {
                    width: 100vw;
                    height: 100vh;
                    border: none;
                }
            </style>
        </head>
        <body>
            <iframe src="${url}"></iframe>
        </body>
        </html>
    `);
}
</script>




<div class="container">

<h1>Seb Web</h1>

<div style="height: 5.25vw;"></div>

<!-- Games Button -->
<center>


<button onclick="openGames()">Games</button>

<script>
async function openGames() {
    // Open the about:blank tab immediately
    const win = window.open("about:blank", "_blank");

    if (!win) {
        alert("Please allow popups for this website.");
        return;
    }

    try {
        // Download the HTML source
        const response = await fetch(
            "https://cdn.jsdelivr.net/gh/sebwebstuff/sebwebfile@main/stuff-test/index.html"
        );

        if (!response.ok) {
            throw new Error("Could not download Space Waves HTML");
        }

        let html = await response.text();

        // Make relative files load from the Space Waves folder
        const baseURL =
            "https://cdn.jsdelivr.net/gh/sebwebstuff/sebwebfile@main/stuff-test/";

        if (!/<base\s/i.test(html)) {
            html = html.replace(
                /<head([^>]*)>/i,
                `<head$1><base href="${baseURL}">`
            );
        }

        // Write the HTML into about:blank
        win.document.open();
        win.document.write(html);
        win.document.close();

    } catch (error) {
        console.error(error);

        win.document.body.innerHTML =
            "<h1>Failed to load Space Waves</h1>" +
            "<p>" + error.message + "</p>";
    }
}
</script>


</center>

<div style="height: 2.625vw;"></div>

<!-- backup -->
<center>
<a href="https://cdn.jsdelivr.net/gh/sebwebstuff/sebwebdevpage/index.html">
	<button class="good">backup backup</button>
</a>
</center>

</div>


</body>
